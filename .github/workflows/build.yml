name: Build Kinesis Extreme (BPF Backport Attempt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32z1-dev libelf-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget zstd
        sudo apt-get install -y gcc-arm-linux-gnueabi || true

    - name: Download Toolchain (Neutron Clang)
      run: |
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -O neutron-clang.tar.zst
        mkdir -p clang
        tar -xf neutron-clang.tar.zst -C clang
        rm neutron-clang.tar.zst

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$PWD/clang/bin:$PATH"
        
        make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
        
        # 1. Matikan fitur yang bikin error Clang
        ./scripts/config --file out/.config -d CONFIG_SHADOW_CALL_STACK
        
        # 2. "Bumbu" BPF ala Saamrox (Memaksa fitur BPF aktif)
        ./scripts/config --file out/.config \
          -e CONFIG_BPF_SYSCALL \
          -e CONFIG_BPF_JIT \
          -e CONFIG_CGROUP_BPF \
          -e CONFIG_NET_CLS_BPF \
          -e CONFIG_NET_ACT_BPF
        
        # 3. Aktifkan fitur Extreme (Kalau ada di source code Clarencelol)
        ./scripts/config --file out/.config \
          -e CONFIG_ADRENO_IDLER \
          -e CONFIG_GPU_BOOST || true
        
        make O=out ARCH=arm64 olddefconfig
        
        # 4. Trik Build: Paksa menghasilkan Image.gz dan pakai LLVM
        make -j2 O=out ARCH=arm64 CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KERNEL_IMAGE_NAME=Image.gz

    - name: Package Kernel (AnyKernel3)
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        # Kita cuma copy Image.gz, karena script AnyKernel3 butuh itu
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        # Kita gunakan script AnyKernel3 yang sudah kita edit sebelumnya (yang ada miatoll-nya)
        # Atau kalau kamu punya zip Saamrox, kamu bisa ambil anykernel.sh-nya
        zip -r9 Kinesis-Extreme-BPF.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kinesis-Extreme-BPF
        path: AnyKernel3/Kinesis-Extreme-BPF.zip
