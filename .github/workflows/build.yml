name: Build Kinesis Extreme (Clang 22)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32z1-dev libelf-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget zstd
        sudo apt-get install -y gcc-arm-linux-gnueabi || true

    - name: Download Toolchain (Clang 22 - RedHat)
      run: |
        # Menggunakan Clang 22 dari rilis RedHat (lebih stabil dari Google Source)
        wget https://github.com/sbwml/redhat-llvm-project/releases/download/clang-22.0.2/clang-22.0.2-x86_64-redhat-linux.tar.xz -O clang-22.tar.xz
        mkdir -p clang
        tar -xf clang-22.tar.xz -C clang --strip-components=1
        rm clang-22.tar.xz

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$PWD/clang/bin:$PATH"
        
        make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
        
        # Trik agar tidak error Clang
        ./scripts/config --file out/.config -d CONFIG_SHADOW_CALL_STACK
        
        # Bumbu Extreme & BPF
        ./scripts/config --file out/.config \
          -e CONFIG_BPF_SYSCALL \
          -e CONFIG_BPF_JIT \
          -e CONFIG_CGROUP_BPF \
          -e CONFIG_ADRENO_IDLER \
          -e CONFIG_GPU_BOOST || true
        
        make O=out ARCH=arm64 olddefconfig
        
        # Build pakai Clang 22
        make -j2 O=out ARCH=arm64 CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KERNEL_IMAGE_NAME=Image.gz

    - name: Upload Artifact (Image.gz)
      uses: actions/upload-artifact@v4
      with:
        name: Kinesis-Image-gz-Clang22
        path: out/arch/arm64/boot/Image.gz
