name: Build Kinesis Extreme (v2 - Flashable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32z1-dev libelf-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget zstd
        sudo apt-get install -y gcc-arm-linux-gnueabi || true

    - name: Download Toolchain (Neutron Clang)
      run: |
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -O neutron-clang.tar.zst
        mkdir -p clang
        tar -xf neutron-clang.tar.zst -C clang
        rm neutron-clang.tar.zst

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$PWD/clang/bin:$PATH"
        
        make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
        
        # Aktifkan fitur Extreme & BPF
        ./scripts/config --file out/.config \
          -d CONFIG_SHADOW_CALL_STACK \
          -e CONFIG_BPF_SYSCALL \
          -e CONFIG_BPF_JIT \
          -e CONFIG_CGROUP_BPF \
          -e CONFIG_ADRENO_IDLER \
          -e CONFIG_GPU_BOOST || true
        
        make O=out ARCH=arm64 olddefconfig
        
        # Trik build: Paksa menghasilkan Image.gz
        make -j2 O=out ARCH=arm64 CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KERNEL_IMAGE_NAME=Image.gz

    - name: Package Kernel (AnyKernel3 Miatoll)
      run: |
        # Ambil AnyKernel3 yang sudah dikonfigurasi untuk Miatoll (punya Saamrox)
        git clone --depth=1 https://github.com/saamrox/AnyKernel3 -b miatoll AnyKernel3
        
        # Bersihkan isi lama, masukkan kernel baru
        rm -f AnyKernel3/Image.gz AnyKernel3/dtbo.img
        
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
        else
          # Kalau ternyata masih Image mentah, kompres manual
          gzip -c out/arch/arm64/boot/Image > AnyKernel3/Image.gz
        fi
        
        # Opsional: Ambil dtbo.img dari ROM kamu (kamu harus upload ke repo atau pakai link)
        # Untuk sekarang, kita biarkan script AnyKernel3 menanganinya.
        
        cd AnyKernel3
        zip -r9 Kinesis-Extreme-Flashable.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kinesis-Extreme-Zip
        path: AnyKernel3/Kinesis-Extreme-Flashable.zip
